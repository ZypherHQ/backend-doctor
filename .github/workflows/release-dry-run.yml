name: Release Dry Run

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release-dry-run.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "Dockerfile"
      - ".dockerignore"
      - "packaging/**"
      - "scripts/release/**"
      - "npm/backend-doctor/**"

permissions:
  contents: read

jobs:
  platform-binaries:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            artifact: macos-x64
            target: x86_64-apple-darwin
          - os: macos-15
            artifact: macos-arm64
            target: aarch64-apple-darwin
          - os: windows-latest
            artifact: windows-x64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: Build CLI binary
        shell: bash
        env:
          BACKEND_DOCTOR_TARGET: ${{ matrix.target }}
        run: scripts/release/build-local-binaries.sh
      - name: Upload platform artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-doctor-${{ matrix.artifact }}
          path: dist/backend-doctor-*/
          if-no-files-found: error
          retention-days: 14

  npm-package:
    name: npm package dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: platform-binaries
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Test local release metadata dry run
        run: scripts/release/test-local-release-metadata.sh
      - name: Download platform artifacts for npm package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: backend-doctor-*
          path: dist/npm-release-assets
          merge-multiple: false
      - name: Stage npm package binaries
        env:
          BACKEND_DOCTOR_REQUIRED_NPM_TARGETS: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc
        run: scripts/release/stage-npm-package-binaries.sh dist/npm-release-assets
      - name: Test npm package
        working-directory: npm/backend-doctor
        run: npm test --if-present
      - name: Validate npm package dry run
        working-directory: npm/backend-doctor
        run: npm pack --dry-run
      - name: Generate local release metadata drafts
        run: scripts/release/generate-local-release-metadata.sh dist/npm-release-assets dist/local-release-metadata/platform-binaries
      - name: Upload local release metadata drafts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-release-metadata
          path: dist/local-release-metadata/
          if-no-files-found: error
          retention-days: 14
      - name: Create npm package artifact and checksum
        working-directory: npm/backend-doctor
        run: |
          set -euo pipefail
          mkdir -p ../../dist/npm
          npm pack --pack-destination ../../dist/npm

          cd ../../dist/npm
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ./*.tgz > SHA256SUMS
          else
            shasum -a 256 ./*.tgz > SHA256SUMS
          fi
      - name: Upload npm dry-run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-doctor-npm-package
          path: dist/npm/
          if-no-files-found: error
          retention-days: 14

  docker-image:
    name: Docker image dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build Docker image
        run: docker build -t backend-doctor:dry-run .
      - name: Verify Docker CLI
        run: docker run --rm backend-doctor:dry-run --help

  homebrew-formula:
    name: Homebrew formula dry run
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Generate Homebrew formula
        shell: bash
        run: scripts/release/generate-homebrew-formula.sh
      - name: Test Homebrew formula dry run
        shell: bash
        run: scripts/release/test-homebrew-formula.sh
      - name: Upload Homebrew dry-run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-doctor-homebrew-formula
          path: dist/homebrew/
          if-no-files-found: error
          retention-days: 14
